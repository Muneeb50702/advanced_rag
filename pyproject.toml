[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-rag"
version = "0.1.0"
description = "Auditable document QA with retrieval evaluation and optional local generation"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rag = "advanced_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
